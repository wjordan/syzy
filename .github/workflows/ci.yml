name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Builds the CLI and the loadable extension; the extension is a
      # cgo c-shared build, so this is also the check that the release
      # artifacts still link.
      - name: build
        run: make build ext

      - name: test
        run: go test -race -count=1 ./...

  bench-smoke:
    name: bench (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # Sanity-only: run the curated scenarios once with -benchtime=1x so a
      # broken bench or a stale scenario package path surfaces in CI without
      # spending real bench time. Real reports come from benchmarks/run.sh
      # on a developer machine.
      - name: bench compile + smoke
        run: go run ./benchmarks -benchtime 1x -count 1 -report=false
