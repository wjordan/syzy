name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs on the self-hosted `kedge` pool: one disposable
          # microVM per job, with an in-VM dockerd that the Postgres
          # step below needs. There is no macOS pool, so macOS stays on
          # GitHub-hosted runners.
          - {name: linux, runs-on: kedge}
          - {name: macos, runs-on: macos-14}
    # Tests that bind a Unix socket build the path under t.TempDir(),
    # whose test-name segment runs to ~45 characters. darwin's sun_path
    # holds 103 bytes and its default TMPDIR is a 47-character
    # /var/folders/<hash>/T path, so the pair overflows and bind(2)
    # fails with a bare EINVAL. /tmp buys back those 43 characters; on
    # Linux this is already the default and changes nothing.
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: make vet

      # Builds the CLI and the loadable extension; the extension is a
      # cgo c-shared build, so this is also the check that the release
      # artifacts still link.
      - name: build
        run: make build ext build-pg

      # Live Postgres for the PG engine suite (Linux only; macOS runners
      # have no docker). Exporting SYZY_PG_TEST_URL makes PG tests
      # mandatory on Linux: with the variable set they fail — not skip —
      # if the server is unreachable.
      - name: start postgres
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/pg-test-container.sh
          echo "SYZY_PG_TEST_URL=$(scripts/pg-test-container.sh start)" >> "$GITHUB_ENV"
          # Coordinated-uniqueness tests need Postgres to dial back into the
          # test process over a socket both sides can see (the script bind
          # -mounts this directory into the container).
          echo "SYZY_PG_TEST_SOCKDIR=${SYZY_PG_TEST_SOCKDIR:-/tmp/syzy-pg-test-sock}" >> "$GITHUB_ENV"

      - name: test
        run: go test -race -count=1 ./...

      # The pg module is separate, so ./... above does not reach it.
      - name: test (postgres module)
        run: make test-pg

      # Downstream consumers import the root module without this repo's
      # go.work, so the workspace must never be what makes root resolve.
      # GOWORK=off is how CI proves root stands alone.
      - name: root module builds without the workspace
        run: GOWORK=off go build ./...

  bench-smoke:
    name: bench (smoke)
    runs-on: kedge
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # Sanity-only: run the curated scenarios once with -benchtime=1x so a
      # broken bench or a stale scenario package path surfaces in CI without
      # spending real bench time. Real reports come from benchmarks/run.sh
      # on a developer machine.
      - name: bench compile + smoke
        run: go run ./benchmarks -benchtime 1x -count 1 -report=false
